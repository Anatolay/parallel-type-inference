resolver: lts-18.19

packages:
- .

extra-deps:
- accelerate-1.3.0.0
- accelerate-llvm-1.3.0.0
- accelerate-llvm-native-1.3.0.0
- accelerate-llvm-ptx-1.3.0.0
- cuda-0.11.0.0
- nvvm-0.10.0.0


flags:
  llvm-hs:
    shared-llvm: true

docker:
  enable: false

  repo: "nihon/compiler-env:latest"

  registry-login: true

  auto-pull: true

  stack-exe: host
